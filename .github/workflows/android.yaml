name: Build Offline AI (from ZIP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # EKSTRAKSI ZIP OTOMATIS
      # User cukup upload file .zip (berisi project) ke root repo.
      # Actions akan mencari ZIP → ekstrak → build.
      # ============================================================
      - name: Find and extract project ZIP
        id: extract
        run: |
          set -e
          
          echo "==> Mencari file ZIP di repository..."
          
          # Prioritas nama file yang umum
          ZIP_FILE=""
          for candidate in \
              "OfflineAI-Android.zip" \
              "offline-ai.zip" \
              "OfflineAI.zip" \
              "app.zip" \
              "project.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done
          
          # Kalau belum ketemu, ambil ZIP pertama yang ada di root
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1 | sed 's|^\./||')
          fi
          
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ditemukan file .zip di root repository!"
            echo "Silakan upload file ZIP project (misalnya OfflineAI-Android.zip) ke root repo."
            ls -la
            exit 1
          fi
          
          echo "==> Ditemukan ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          
          # Bersihkan folder target jika sudah ada
          rm -rf extracted_project
          mkdir -p extracted_project
          
          echo "==> Mengekstrak $ZIP_FILE ..."
          unzip -q -o "$ZIP_FILE" -d extracted_project
          
          # Cari folder project di dalam hasil ekstraksi
          # (biasanya ZIP berisi folder OfflineAI-Android/ atau langsung file project)
          PROJECT_DIR=""
          
          if [ -f "extracted_project/settings.gradle.kts" ] || [ -f "extracted_project/settings.gradle" ]; then
            PROJECT_DIR="extracted_project"
          elif [ -f "extracted_project/OfflineAI-Android/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted_project/OfflineAI-Android"
          else
            # Cari folder yang punya settings.gradle.kts
            FOUND=$(find extracted_project -maxdepth 2 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi
          
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Tidak menemukan project Android di dalam ZIP!"
            echo "Isi hasil ekstraksi:"
            find extracted_project -maxdepth 3 -type f | head -40
            exit 1
          fi
          
          echo "==> Project ditemukan di: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          
          # Tampilkan struktur singkat
          echo "==> Struktur project:"
          ls -la "$PROJECT_DIR"
          
          # Pastikan gradlew executable (kalau ada)
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -e
          echo "==> Working directory: $(pwd)"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew tidak ditemukan, mencoba menggunakan gradle sistem..."
            # Generate wrapper jika belum ada
            gradle wrapper --gradle-version 8.11.1 || true
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleDebug --stacktrace --no-daemon
            else
              gradle assembleDebug --stacktrace --no-daemon
            fi
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build Release APK (unsigned)
        working-directory: ${{ steps.extract.outputs.project_dir }}
        continue-on-error: true
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || true
          else
            gradle assembleRelease --stacktrace --no-daemon || true
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-release-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          echo "### Build selesai" >> $GITHUB_STEP_SUMMARY
          echo "- ZIP yang digunakan: \`${{ steps.extract.outputs.zip_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Project dir: \`${{ steps.extract.outputs.project_dir }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact APK bisa di-download di tab **Actions** → Artifacts" >> $GITHUB_STEP_SUMMARY
