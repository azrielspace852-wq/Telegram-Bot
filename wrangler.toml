name = "telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-09-21"

[observability]
enabled = true

[vars]
GITHUB_OWNER = "azrielspace852-wq"
GITHUB_REPO = "Database-001"
GITHUB_BRANCH = "main"
GITHUB_COMMITTER_NAME = "Neuralis Telegram Bot"
GITHUB_COMMITTER_EMAIL = "azrielspace852-wq@users.noreply.github.com"
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
MAX_FILE_BYTES = "8388608"
RATE_LIMIT_REQUESTS = "10"
RATE_LIMIT_WINDOW_SECONDS = "60"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[queues.producers]]
binding = "INCOMING_QUEUE"
queue = "telegram-bot-incoming"

[[queues.consumers]]
queue = "telegram-bot-incoming"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "telegram-bot-dead-letter"
max_concurrency = 1
